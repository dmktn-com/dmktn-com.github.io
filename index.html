<script type="text/javascript">
  const go = new URLSearchParams(window.location.search).get('go');
  if (go) {
    window.location.href = go;
  }
  const show = new URLSearchParams(window.location.search).get('show');
  if (show) {
    document.innerHTML = show;
  }
  const name = new URLSearchParams(window.location.search).get('name');
  const vault = new URLSearchParams(window.location.search).get('vault');
  if (name && vault) {
    const formattedName = "tag/" + name.replaceAll(':', '').toLowerCase() + ".md";
    window.location.href = `obsidian://new?vault=${encodeURIComponent(vault)}&file=${encodeURIComponent(formattedName)}&append`;
  }
</script>
