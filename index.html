<script type="text/javascript">
  const name = new URLSearchParams(window.location.search).get('name');
  const vault = new URLSearchParams(window.location.search).get('vault');
  if (name && vault) {
    const formattedName = "tag/" + name.replaceAll(':', '').toLowerCase();
    window.location.href = `obsidian://open?vault=${encodeURIComponent(vault)}&name=${encodeURIComponent(formattedName)}`;
  }
</script>
